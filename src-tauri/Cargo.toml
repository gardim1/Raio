[package]
name = "raio"
version = "0.1.0-alpha.2"
license = "MIT"
description = "Local-first desktop companion that shows where an AI coding agent works in a project"
authors = ["Vinicius Gardim"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "raio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[[bin]]
name = "raio"
path = "src/main.rs"

[[bin]]
name = "raio-hook"
path = "src/bin/raio-hook.rs"

[dependencies]
ignore = "0.4"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
