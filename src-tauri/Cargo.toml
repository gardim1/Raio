[package]
name = "raio"
version = "0.1.0"
description = "Local-first desktop companion that shows where an AI coding agent works in a project"
authors = ["Vinicius Gardim"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "raio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = ["tray-icon"] }
